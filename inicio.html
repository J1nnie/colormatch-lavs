<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>ColorMatch</title>

</head>

<body>

    <!-- MENU -->

    <header>

        <nav>

            <ul>
                 <li>
                    <a href="inicio.html">Início</a>
                </li>
                <li>
                    <a href="en.html">Biblioteca</a>
                </li>

                <li>
                    
                    <a href="recursos.html">Recursos</a>
                </li>

                <li>
                    <a href="informações.html">Mais informações</a>
                </li>

                <li>
                    <a href="site.html">Sobre o site</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main>
<div class="titulo">
        <h1 class="titulo-principal">ColorMatch</h1>  </div>

        <p>
          <i>Iforme a cor que deseja combinar</i>  
        </p>


        <!-- PESQUISA -->

        <div class="pesquisa">

            <input
            id="campoPesquisa"
                type="text"
                placeholder="Digite uma cor ou código HEX"
            >

            <button id="botaoPesquisa">
                Pesquisar
            </button>
            <p id="resultadoPesquisa"></p>

        </div>


        <!-- CORES RÁPIDAS -->

        <h2>Cores populares</h2>

        <div class="cores">

            <div class="cor vermelho" 
            data-hex="#681015"> 
            <span class = "codigo"></span></div>

            <div class="cor amarelo" 
            data-hex="#fff1b2"> <span class = "codigo"></span></div>

            <div class="cor azul" 
            data-hex="#b8e7f3"> <span class = "codigo"></span></div>

            <div class="cor verde" 
            data-hex="#16853b"> <span class = "codigo"></span></div>

            <div class="cor roxo"
            data-hex="#8b4f91"> <span class = "codigo"></span></div>

            <div class="cor rosa" 
            data-hex="#c0008f"> <span class = "codigo"></span></div>

        </div>


        <!-- PALETA -->

        <section class="paleta">

            <h2>Paleta mais usada</h2>

            <div class="cores-paleta">

                <div class="cor-p1" style="background-color: #bbadeb;"></div>
                <div class="cor-p2" style="background-color: #dce8f8;"></div>
                <div class="cor-p3" style="background-color: #651048;"></div>
                <div class="cor-p4" style="background-color: #dfd800;"></div>
                <div class="cor-p5" style="background-color: #05084e;"></div>

            </div>

        </section>

    </main>
    <script src="illit.js"></script>


</body>

</html>
