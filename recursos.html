        <h1>Recursos</h1>

        <p>
            <br>Explore cores usando a câmera e a roda de cores.
        </p>


        <!-- CÂMERA -->

        <section class="camera">

            <h2>Câmera</h2>

            <video id="camera" autoplay></video>

            <br>

            <button id="abrirCamera">
                Abrir câmera
            </button>

        </section>


        <!-- RODA DE CORES -->

        <section class="roda">

            <h2><br>Círculo de cores</h2>

            <div id="colorWheel"></div>

            <p>
                Cor selecionada:
                <span id="selectedColor">Nenhuma</span>
            </p>
            <p>
                Código HEX : <span id="selectedHEX">---</span>
            </p>

            <div id="coresEscolhidas"></div>
            <button
            id="adicionarCor">Adicionar cor</button>
            <button id="salvarPaleta">Salvar paleta</button>
            <p id="mensagemPaleta"></p>
                

        </section>
